server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ứng dụng một trang: mọi đường dẫn đều trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File build có hash trong tên nên cache lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
